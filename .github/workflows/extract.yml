name: Extract SaaS package

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract package
        run: |
          rm -rf /tmp/saas-package
          mkdir -p /tmp/saas-package
          unzip -q criador-de-sites-saas.zip -d /tmp/saas-package
          cp -a /tmp/saas-package/criador-de-sites/. .
          rm -f criador-de-sites-saas.zip
      - name: Commit extracted files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: extract SaaS package"
          git push
